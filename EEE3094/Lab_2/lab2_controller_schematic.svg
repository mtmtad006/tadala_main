<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 700" width="1340" height="700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  <marker id="arp" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b0000"/></marker>
</defs>
<style>
  text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#111}
  .w{stroke:#1a1a1a;stroke-width:2;fill:none}
  .res{stroke:#8b0000;stroke-width:2;fill:#fff8e1}
  .op{stroke:#00478a;stroke-width:2.5;fill:#e8f1fb}
  .d{fill:#1a1a1a}
  .b{font-weight:bold}
  .sm{font-size:12px;fill:#444}
  .box{stroke:#555;stroke-width:1.5;fill:#f3f3f3}
  .fb{stroke:#c0392b;stroke-width:2;fill:none;stroke-dasharray:7 4}
  .term{fill:#fff;stroke:#1a1a1a;stroke-width:2}
  .pwr{stroke:#00478a;stroke-width:1.5;fill:none}
</style>
<rect width="1340" height="700" fill="#fff"/>
<text x="20" y="32" font-size="20" class="b" style="font-size:20px">Lab 2 controller - two op-amp stages (differential amp + level shift)</text>

<!-- region labels -->
<rect x="40" y="110" width="650" height="360" fill="none" stroke="#bbb" stroke-dasharray="6 4"/>
<text x="50" y="130" class="b">STAGE 1 (U1): error amp, gain K = Rb/Ra</text>
<rect x="700" y="46" width="450" height="424" fill="none" stroke="#bbb" stroke-dasharray="6 4" transform="translate(0,0)"/>
<text x="1040" y="64" class="b">STAGE 2 (U2): + 2.5 V hover</text>

<!-- ============ STAGE 1 ============ -->
<circle class="term" cx="60" cy="260" r="5"/>
<text x="40" y="285" class="b">Vfb</text>
<path class="w" d="M60,260 H130 M190,260 H470"/>
<rect class="res" x="130" y="252" width="60" height="16"/>
<text x="160" y="244" text-anchor="middle">Ra 82k</text>

<circle class="term" cx="60" cy="340" r="5"/>
<text x="40" y="365" class="b">Vref</text>
<path class="w" d="M60,340 H130 M190,340 H470"/>
<rect class="res" x="130" y="332" width="60" height="16"/>
<text x="160" y="324" text-anchor="middle">Rc 82k</text>

<!-- Rd to ground -->
<path class="w" d="M400,340 V370 M400,430 V455 M386,455 H414 M391,461 H409 M396,467 H404"/>
<rect class="res" x="392" y="370" width="16" height="60"/>
<text x="416" y="404">Rd 1k</text>

<!-- Rb feedback -->
<path class="w" d="M400,260 V170 H470 M530,170 H650 V300"/>
<rect class="res" x="470" y="162" width="60" height="16"/>
<text x="500" y="154" text-anchor="middle">Rb 1k</text>
<circle class="d" cx="400" cy="260" r="4"/>
<circle class="d" cx="400" cy="340" r="4"/>

<!-- U1 -->
<polygon class="op" points="470,230 470,370 600,300"/>
<text x="476" y="266" style="font-size:20px" class="b">-</text>
<text x="476" y="348" style="font-size:20px" class="b">+</text>
<text x="528" y="306" class="b">U1</text>
<path class="pwr" d="M535,265 V215 M535,335 V385"/>
<text x="535" y="208" text-anchor="middle" class="sm">+15 V</text>
<text x="535" y="402" text-anchor="middle" class="sm">-15 V</text>

<!-- e1 -->
<path class="w" d="M600,300 H700 V340 H740"/>
<circle class="d" cx="650" cy="300" r="4"/>
<text x="670" y="290" class="b">e1</text>

<!-- ============ STAGE 2 ============ -->
<rect class="res" x="740" y="332" width="60" height="16"/>
<path class="w" d="M800,340 H950"/>
<text x="770" y="324" text-anchor="middle">Rg 47k</text>
<circle class="d" cx="900" cy="340" r="4"/>
<path class="w" d="M900,340 V370 M900,430 V455 M886,455 H914 M891,461 H909 M896,467 H904"/>
<rect class="res" x="892" y="370" width="16" height="60"/>
<text x="916" y="404">Rh 47k</text>

<!-- inverting side -->
<path class="w" d="M790,190 H820 M880,190 H900 M900,90 V260 H950"/>
<rect class="res" x="820" y="182" width="60" height="16"/>
<text x="850" y="174" text-anchor="middle">Re 47k</text>
<circle class="d" cx="900" cy="190" r="4"/>

<!-- Rf2 feedback -->
<path class="w" d="M1130,300 V90 H1060 M1000,90 H900"/>
<rect class="res" x="1000" y="82" width="60" height="16"/>
<text x="1030" y="74" text-anchor="middle">Rf2 47k</text>
<circle class="d" cx="1130" cy="300" r="4"/>

<!-- U2 -->
<polygon class="op" points="950,230 950,370 1080,300"/>
<text x="956" y="266" style="font-size:20px" class="b">-</text>
<text x="956" y="348" style="font-size:20px" class="b">+</text>
<text x="1008" y="306" class="b">U2</text>
<path class="pwr" d="M1015,265 V215 M1015,335 V385"/>
<text x="1015" y="208" text-anchor="middle" class="sm">+15 V</text>
<text x="1015" y="402" text-anchor="middle" class="sm">-15 V</text>

<!-- Level-shift divider (x=790) -->
<text x="790" y="14" text-anchor="middle" class="sm b">-15 V rail</text>
<path class="w" d="M790,18 V30 M790,80 V95 M790,145 V205 M790,255 V275 M776,275 H804 M781,281 H799 M786,287 H794"/>
<rect class="res" x="782" y="30" width="16" height="50"/>
<rect class="res" x="782" y="95" width="16" height="50"/>
<path d="M770,152 L810,90" stroke="#8b0000" stroke-width="2" marker-end="url(#arp)"/>
<rect class="res" x="782" y="205" width="16" height="50"/>
<circle class="d" cx="790" cy="190" r="4"/>
<text x="774" y="60" text-anchor="end">Rtop 10k</text>
<text x="774" y="120" text-anchor="end">Rtrim 5k pot</text>
<text x="774" y="135" text-anchor="end" class="sm">(set ~500 ohm)</text>
<text x="774" y="186" text-anchor="end" class="b">N = -2.5 V</text>
<text x="774" y="234" text-anchor="end">Rbot 2.2k</text>

<!-- output -->
<path class="w" d="M1080,300 H1190" marker-end="url(#ar)"/>
<text x="1160" y="290" class="b">u</text>

<!-- ============ LOOP BLOCKS ============ -->
<rect class="box" x="1190" y="265" width="130" height="70" rx="6"/>
<text x="1255" y="295" text-anchor="middle" class="b">Lab PC ADC</text>
<text x="1255" y="313" text-anchor="middle" class="sm">clips u to 0-5 V</text>
<path class="w" d="M1255,335 V380" marker-end="url(#ar)"/>
<rect class="box" x="1190" y="380" width="130" height="70" rx="6"/>
<text x="1255" y="402" text-anchor="middle" class="b">Kitticopter</text>
<text x="1255" y="420" text-anchor="middle" class="sm">A / (s(tau s + 1))</text>
<text x="1255" y="436" text-anchor="middle" class="sm">net in = u - 2.5 V</text>
<path class="w" d="M1255,450 V475" marker-end="url(#ar)"/>
<rect class="box" x="1190" y="475" width="130" height="70" rx="6"/>
<text x="1255" y="505" text-anchor="middle" class="b">Sensor ks</text>
<text x="1255" y="523" text-anchor="middle" class="sm">0.6599 V/m</text>
<text x="1330" y="428" text-anchor="end" class="b" style="display:none">y</text>

<!-- feedback return -->
<path class="fb" d="M1190,510 H25 V260 H55" marker-end="url(#arr)"/>
<text x="700" y="502" text-anchor="middle" style="fill:#c0392b" class="b">Vfb = ks * y  (position sensor voltage, fed back to Ra)</text>
<text x="70" y="420" class="sm">Vref = ks * r</text>
<text x="70" y="436" class="sm">(set-point source)</text>

<!-- ============ NOTES ============ -->
<line x1="20" y1="570" x2="1320" y2="570" stroke="#bbb"/>
<text x="20" y="592" class="b">Stage 1:</text>
<text x="90" y="592">e1 = g_r1*Vref - g_f1*Vfb,   g_f1 = Rb/Ra = 0.0122 (= K),   g_r1 = Rd/(Rc+Rd) * (1 + Rb/Ra) = 0.0122   (Ra = Rc = 82k, Rb = Rd = 1k)</text>
<text x="20" y="614" class="b">Stage 2:</text>
<text x="90" y="614">u = e1 + 2.5 V   (unity-gain differential amp: all four resistors 47k; inverting input driven by the -2.5 V node N, so the level shift is +2.5 V)</text>
<text x="20" y="636" class="b">Supplies:</text>
<text x="90" y="636">+/-15 V on both op-amps (output swing assumed +/-13.5 V). Divider: -15 V - Rtop - Rtrim - N - Rbot - GND; adjust Rtrim until u = 2.5 V with e1 = 0.</text>
<text x="20" y="658" class="b">Loop:</text>
<text x="90" y="658">u -> PC ADC clip (0-5 V) -> Kitticopter (net input = u - Vhover) -> position y -> sensor ks -> Vfb.   Effective loop gain K_eff = g_f1 * 1 = 0.0122.</text>
<text x="20" y="684" class="sm">Generated from lab2_circuit_model.m component values. Dashed red = feedback path. Blue pins = op-amp supply connections.</text>
</svg>
